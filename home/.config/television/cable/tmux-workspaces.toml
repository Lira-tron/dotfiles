[metadata]
name = "tmux-workspaces"
description = "Browse tmux sessions, workspaces, and knowledge directories"
requirements = ["tmux", "fd", "eza"]

[source]
command = [
  "{ tmux list-sessions -F '#{session_last_attached}\t[session] #{session_name}\t#{session_name}' 2>/dev/null | sort -rn | cut -f2-; fd -t d -d 1 . $HOME/workplace --format '[dir] {/}\t{}\t{/}'; bash $HOME/.config/television/cable/tmux-knowledge.sh sessions | head -1; bash $HOME/.config/television/cable/tmux-knowledge.sh projects; bash $HOME/.config/television/cable/tmux-knowledge.sh designs; bash $HOME/.config/television/cable/tmux-knowledge.sh specs; bash $HOME/.config/television/cable/tmux-knowledge.sh memory; bash $HOME/.config/television/cable/tmux-knowledge.sh memories; bash $HOME/.config/television/cable/tmux-knowledge.sh ops; bash $HOME/.config/television/cable/tmux-knowledge.sh others; }",
  "tmux list-sessions -F '#{session_last_attached}\t[session] #{session_name}\t#{session_name}' 2>/dev/null | sort -rn | cut -f2-",
  "fd -t d -d 1 . $HOME/workplace --format '[dir] {/}\t{}\t{/}'",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh sessions",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh projects",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh designs",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh specs",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh memory",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh memories",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh ops",
  "bash $HOME/.config/television/cable/tmux-knowledge.sh others",
]
no_sort = true
frecency = false
display = "{split:\t:0}"
output = "{split:\t:1}"

[preview]
command = "if echo '{split:\t:0}' | grep -q '\\[session\\]'; then tmux capture-pane -t '{split:\t:2}' -p 2>/dev/null || echo 'No preview'; else eza -la --color=always '{split:\t:1}'; fi"

[keybindings]
enter = "actions:connect"
ctrl-d = ["actions:kill", "reload_source"]

[actions.connect]
description = "Attach to session or create new session from directory"
command = "if echo '{split:\t:0}' | grep -q '\\[session\\]'; then tmux switch-client -t '{split:\t:2}' 2>/dev/null || tmux attach -t '{split:\t:2}'; else tmux new-session -d -s '{split:\t:2}' -c '{split:\t:1}' 2>/dev/null; tmux switch-client -t '{split:\t:2}' 2>/dev/null || tmux attach -t '{split:\t:2}'; fi"
mode = "execute"

[actions.kill]
description = "Kill the selected tmux session"
command = "tmux kill-session -t '{split:\t:2}' 2>/dev/null && echo 'Killed session' || echo 'No session by that name'"
mode = "fork"
