[metadata]
name = "rex-workspaces"
description = "Open Git worktrees and directories as Rex sessions, or switch between sessions"
requirements = ["rex", "fd", "eza", "python3"]

[source]
command = [
  '''python3 "$HOME/.config/television/cable/rex-worktrees.py" current''',
  '''python3 "$HOME/.config/television/cable/rex-worktrees.py" sessions''',
  '''fd -t d -d 1 . "$HOME/workplace" --format '[dir] {/}	{}' ''',
]
frecency = true
display = "{split:\t:0}"
output = "{split:\t:1}"

[preview]
command = '''python3 "$HOME/.config/television/cable/rex-worktrees.py" preview '{split:\t:1}' '''

[keybindings]
enter = "actions:connect"
tab = "select_next_entry"
backtab = "select_prev_entry"
ctrl-e = "cycle_sources"
ctrl-d = "actions:delete"
ctrl-u = "actions:force_delete"
ctrl-g = "actions:create"

[actions.connect]
description = "Switch to the session, or open the worktree or directory as a session"
command = '''python3 "$HOME/.config/television/cable/rex-worktrees.py" connect '{split:\t:1}' '''
mode = "execute"

[actions.delete]
description = "Delete the worktree and close its session, or close the session"
command = '''python3 "$HOME/.config/television/cable/rex-worktrees.py" delete '{split:\t:1}' '''
mode = "execute"

[actions.force_delete]
description = "Force-delete the worktree and close its session"
command = '''python3 "$HOME/.config/television/cable/rex-worktrees.py" delete '{split:\t:1}' --force'''
mode = "execute"

[actions.create]
description = "Create a named worktree for the selected tree's repository, or the current folder's"
command = '''python3 "$HOME/.config/television/cable/rex-worktrees.py" create '{split:\t:1}' '''
mode = "execute"