[metadata]
name = "herdr-knowledge"
description = "Browse knowledge and session directories as Herdr workspaces"
requirements = ["herdr", "fd", "eza", "bash"]

[source]
command = [
  '''{ bash "$HOME/.config/television/cable/tmux-knowledge.sh" sessions | head -1; bash "$HOME/.config/television/cable/tmux-knowledge.sh" projects; bash "$HOME/.config/television/cable/tmux-knowledge.sh" designs; bash "$HOME/.config/television/cable/tmux-knowledge.sh" specs; bash "$HOME/.config/television/cable/tmux-knowledge.sh" memory; bash "$HOME/.config/television/cable/tmux-knowledge.sh" memories; bash "$HOME/.config/television/cable/tmux-knowledge.sh" ops; bash "$HOME/.config/television/cable/tmux-knowledge.sh" others; }''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" sessions''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" projects''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" designs''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" specs''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" memory''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" memories''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" ops''',
  '''bash "$HOME/.config/television/cable/tmux-knowledge.sh" others''',
]
no_sort = false
frecency = true
display = "{split:\t:0}"
output = "{split:\t:1}"

[preview]
command = '''eza -la --color=always '{split:\t:1}' '''

[keybindings]
enter = "actions:connect"
ctrl-e = "cycle_sources"

[actions.connect]
description = "Create a focused Herdr workspace from the selected directory"
command = '''herdr workspace create --cwd '{split:\t:1}' --label '{split:\t:2}' --focus'''
mode = "execute"
