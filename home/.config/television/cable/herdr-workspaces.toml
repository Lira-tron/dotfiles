[metadata]
name = "herdr-workspaces"
description = "Browse Herdr workspaces, agents, panes, and directories"
requirements = ["herdr", "jq", "fd", "eza", "bash", "python3"]

[source]
command = [
  '''bash "$HOME/.config/television/cable/herdr-panels.sh" agents''',
  '''bash "$HOME/.config/television/cable/herdr-panels.sh" all''',
  '''bash "$HOME/.config/television/cable/herdr-panels.sh" workspaces''',
  '''bash "$HOME/.config/television/cable/herdr-panels.sh" panes''',
  '''fd -t d -d 1 . "$HOME/workplace" --format '[dir] {/}	{}	{/}' ''',
]
# Preserve the source's agent frequency ranking and All view's type grouping.
no_sort = true
frecency = true
display = "{split:\t:0}"
output = "{split:\t:1}"

[preview]
command = '''
if printf '%s\n' '{split:\t:0}' | grep -q '^\[workspace\]'; then
  herdr pane read '{split:\t:3}' --source recent --lines 200 --ansi
elif printf '%s\n' '{split:\t:0}' | grep -qE '^\[(pane|agent)\]'; then
  herdr pane read '{split:\t:2}' --source recent --lines 200 --ansi
else
  eza -la --color=always '{split:\t:1}'
fi
'''

[keybindings]
enter = "actions:connect"
ctrl-e = "cycle_sources"
ctrl-d = ["actions:close_workspace", "reload_source"]
ctrl-l = "actions:previous_pane"

[actions.connect]
description = "Focus a workspace, pane, or agent, or create a workspace from a directory"
command = '''
python3 "$HOME/.config/television/cable/herdr-previous-pane.py" connect <<'HERDR_CONNECT'
if printf '%s\n' '{split:\t:0}' | grep -q '^\[workspace\]'; then
  herdr workspace focus '{split:\t:2}'
elif printf '%s\n' '{split:\t:0}' | grep -q '^\[pane\]'; then
  herdr pane zoom '{split:\t:2}' --on && herdr tab focus '{split:\t:3}'
elif printf '%s\n' '{split:\t:0}' | grep -q '^\[agent\]'; then
  herdr agent focus '{split:\t:2}' && herdr tab focus '{split:\t:3}'
elif printf '%s\n' '{split:\t:0}' | grep -q '^\[dir\]'; then
  directory_label='{split:\t:2}'
  workspace_id=$(
    herdr api snapshot |
      jq -r --arg label "$directory_label" '
        first(
          .result.snapshot.workspaces[]
          | select(.label == $label)
          | .workspace_id
        ) // empty
      '
  )
  if [ -n "$workspace_id" ]; then
    herdr workspace focus "$workspace_id"
  else
    herdr workspace create --cwd '{split:\t:1}' --label '{split:\t:2}' --focus
  fi
else
  herdr workspace create --cwd '{split:\t:1}' --label '{split:\t:2}' --focus
fi
HERDR_CONNECT
'''
mode = "execute"

[actions.previous_pane]
description = "Return to the pane left by the previous picker selection"
command = '''python3 "$HOME/.config/television/cable/herdr-previous-pane.py" previous'''
mode = "execute"

[actions.close_workspace]
description = "Close the selected Herdr workspace"
command = '''
if printf '%s\n' '{split:\t:0}' | grep -q '^\[workspace\]'; then
  herdr workspace close '{split:\t:2}'
fi
'''
mode = "fork"
