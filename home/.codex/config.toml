model_provider = "amazon-bedrock"
forced_login_method = "api"
check_for_update_on_startup = false
commit_attribution = ""
chatgpt_base_url = "http://127.0.0.1:9"
approvals_reviewer = "auto_review"
model_reasoning_effort = "high"
model = "openai.gpt-5.6-sol"

[mcp_servers.builder-mcp]
command = "builder-mcp"
args = ["--include-tools", "*", "--exclude-tools", "SkillsTool,WorkspaceSearch,Delegate,ToolReactivationTool"]

[mcp_servers.builder-mcp.env]
TOOL_PERSONALIZATION_ENABLED = "false"
TOOL_PERSONALIZATION_MIN_EXECUTIONS = "0"
TOOL_PERSONALIZATION_ROLLOUT_PERCENTAGE = "100"
TOOL_PERSONALIZATION_TRAINING_DAYS = "0"

[mcp_servers.aws-mcp]
command = "uvx"
args = ["mcp-proxy-for-aws@latest", "https://aws-mcp.us-east-1.api.aws/mcp"]

[mcp_servers.diagram-tools-mcp]
command = "diagram-tools-mcp"
args = []

[mcp_servers.loaf_mcp]
command = "loaf-mcp"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.sage-plus-service-mcp]
command = "sage-plus-service-mcp"

[mcp_servers.tickety-mcp]
command = "tickety-mcp"

[shell_environment_policy]
inherit = "all"

[feedback]
enabled = false

[analytics]
enabled = true

[tui]
vim_mode_default = true
status_line = [
    "model-with-reasoning",
    "context-used",
    "current-dir",
    "git-branch",
    "branch-changes",
]
status_line_use_colors = true

[otel]
log_user_prompt = true
trace_exporter = "none"
environment = "stable"
exporter = { otlp-http = { endpoint = "http://127.0.0.1:29774/v1/logs", protocol = "binary" } }
metrics_exporter = { otlp-http = { endpoint = "http://127.0.0.1:29774/v1/metrics", protocol = "binary" } }

[model_providers.amazon-bedrock.aws]
region = "us-east-2"
profile = "codex-DO-NOT-DELETE"

