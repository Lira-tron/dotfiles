model_provider = "amazon-bedrock"
forced_login_method = "api"
check_for_update_on_startup = false
chatgpt_base_url = "http://127.0.0.1:9"
approvals_reviewer = "user"
approval_policy = "on-request"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "detailed"
hide_agent_reasoning = false
model_context_window = 800000
model_auto_compact_token_limit = 700000
model = "openai.gpt-6-astra"
plan_mode_reasoning_effort = "xhigh"

[mcp_servers.builder-mcp]
command = "builder-mcp"
args = ["--include-tools", "*", "--exclude-tools", "SkillsTool,WorkspaceSearch,Delegate,ToolReactivationTool"]
enabled_tools = ["ApolloReadActions", "GetPipelineDetails", "GetPipelineHealth", "GetPipelinesRelevantToUser", "GetSasCampaigns", "GetSasRisks", "GetSoftwareRecommendation", "InternalCodeSearch", "InternalSearch", "MechanicDescribeTool", "MechanicDiscoverTools", "OncallReadActions", "QuipEditor", "ReadInternalWebsites", "ReadRemoteTestRun", "SearchAcronymCentral", "SearchSoftwareRecommendations", "TaskeiGetRoomResources", "TaskeiGetRooms", "TaskeiGetTask", "TaskeiListTasks", "TicketingReadActions", "TicketingWriteActions", "WorkspaceGitDetails"]

[mcp_servers.builder-mcp.tools.QuipEditor]
approval_mode = "prompt"

[mcp_servers.builder-mcp.tools.TicketingWriteActions]
approval_mode = "prompt"

[mcp_servers.builder-mcp.env]
TOOL_PERSONALIZATION_ENABLED = "false"
TOOL_PERSONALIZATION_MIN_EXECUTIONS = "0"
TOOL_PERSONALIZATION_ROLLOUT_PERCENTAGE = "100"
TOOL_PERSONALIZATION_TRAINING_DAYS = "0"

[mcp_servers.aws-knowledge-mcp-server]
